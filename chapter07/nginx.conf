# Minimal Nginx reverse-proxy config for SSE streaming responses
#
# The problem: by default Nginx enables proxy_buffering on upstream responses,
# accumulating chunks until a size threshold before flushing downstream. Clients
# then see "stall for N seconds, then dump everything at once", and reverse
# cancel cannot propagate in time. Buffering must be disabled, and read timeouts
# must be lengthened (streaming responses may stay silent for 30+ seconds).

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ssl_certificate / ssl_certificate_key omitted...

    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ============================================================
        # Streaming-critical settings (without these, streams stall ~30s then dump)
        # ============================================================

        # Disable response buffering: flush each upstream chunk to the client immediately
        proxy_buffering off;
        # Also disable request buffering so the upstream (local gateway) sees client close promptly
        proxy_request_buffering off;

        # Long streaming responses (reasoning models may stay silent for ~1 min) must not be cut by timeout
        # Our gateway sends SSE heartbeats every 15s; leave a 90s margin here
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;

        # HTTP/1.1 chunked transfer: do not close the connection on EOF
        proxy_set_header Connection '';

        # Fallback: even if proxy_buffering off is forgotten, our gateway responses include
        # X-Accel-Buffering: no, so Nginx disables buffering for that response alone.
    }
}

name: CI

on:
  push:
    branches: [main, master, chapter01, chapter02, chapter03]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter:
    name: ${{ matrix.chapter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter:
          - chapter01
          - chapter02
          - chapter03
        node-version: [20]

    defaults:
      run:
        working-directory: ${{ matrix.chapter }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.chapter }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure .env is not tracked
        working-directory: ${{ github.workspace }}
        run: |
          if git ls-files --error-unmatch "${{ matrix.chapter }}/.env" 2>/dev/null; then
            echo "::error::${{ matrix.chapter }}/.env must never be committed"
            exit 1
          fi
          echo "OK: ${{ matrix.chapter }}/.env is not tracked"

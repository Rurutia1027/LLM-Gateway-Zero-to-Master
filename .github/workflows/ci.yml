name: CI

on:
  push:
    branches: [main, master, chapter01, chapter02, chapter03, chapter04]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chapter:
    name: ${{ matrix.chapter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chapter:
          - chapter01
          - chapter02
          - chapter03
          - chapter04
        node-version: [20]

    defaults:
      run:
        working-directory: ${{ matrix.chapter }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools
        if: matrix.chapter == 'chapter04'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.chapter }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Ensure secrets and local DB are not tracked
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for f in \
            "${{ matrix.chapter }}/.env" \
            "${{ matrix.chapter }}/data/gateway.db"
          do
            if git ls-files --error-unmatch "$f" 2>/dev/null; then
              echo "::error::$f must never be committed"
              exit 1
            fi
            echo "OK: $f is not tracked"
          done
